name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Restore cached dist folders and last deploy SHA
      - uses: actions/cache/restore@v4
        id: dist-cache
        with:
          path: |
            apps/*/dist
            home/dist
            .last-deploy-sha
          key: dist-${{ github.sha }}
          restore-keys: dist-

      - name: Detect changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "rebuild_all=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_SHA=""
          if [ -f .last-deploy-sha ]; then
            LAST_SHA=$(cat .last-deploy-sha)
          fi

          if [ -z "$LAST_SHA" ] || ! git cat-file -e "$LAST_SHA" 2>/dev/null; then
            echo "rebuild_all=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$LAST_SHA" HEAD)

          # Global changes → rebuild everything
          if echo "$CHANGED" | grep -qE '^(package\.json|pnpm-lock\.yaml|vite\.config\.ts|vite\.game\.config\.ts|tsconfig\.base\.json|packages/)'; then
            echo "rebuild_all=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          GAMES=$(echo "$CHANGED" | grep '^apps/' | cut -d/ -f2 | sort -u | tr '\n' ' ')
          HOME_CHANGED=$(echo "$CHANGED" | grep -c '^home/' || true)

          echo "rebuild_all=false" >> "$GITHUB_OUTPUT"
          echo "games=$GAMES" >> "$GITHUB_OUTPUT"
          echo "home_changed=$HOME_CHANGED" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          if [ "${{ steps.changes.outputs.rebuild_all }}" = "true" ]; then
            pnpm -r build
          else
            GAMES="${{ steps.changes.outputs.games }}"
            for game in $GAMES; do
              echo "::group::Building $game"
              pnpm --filter "$game" build
              echo "::endgroup::"
            done

            if [ "${{ steps.changes.outputs.home_changed }}" -gt 0 ] || [ -n "$GAMES" ]; then
              echo "::group::Building home"
              pnpm --filter home build
              echo "::endgroup::"
            fi
          fi

      - run: echo "${{ github.sha }}" > .last-deploy-sha

      - uses: actions/cache/save@v4
        with:
          path: |
            apps/*/dist
            home/dist
            .last-deploy-sha
          key: dist-${{ github.sha }}

      - name: Assemble site
        run: |
          mkdir -p _site
          if [ -d home/dist ]; then
            cp -r home/dist/* _site/
          fi
          for app in apps/*/; do
            name=$(basename "$app")
            if [ -d "$app/dist" ]; then
              cp -r "$app/dist" "_site/$name"
            fi
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
